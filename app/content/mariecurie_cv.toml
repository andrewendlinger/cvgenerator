# ****************************** EXPERIENCE *************************************


[[experience]]
role = "Director of the Radium Institute"
company = "University of Paris"
location = "Paris, FR"
date = "1914 - 1934" # Founded in 1909, construction finished 1914
details.academia = [
    "Held the post of Professor of General Physics, succeeding Pierre Curie and becoming the first female professor at the Sorbonne (appointed 1906).",
    "Directed a world-leading research center for chemistry, physics, and medicine, mentoring numerous doctoral students.",
    "Established a new scientific discipline and oversaw fundamental research into the nature of radioactivity and its applications."
]
details.industry = [
    "Managed a premier R\\&D laboratory, securing funding and directing research with both pure science and medical application tracks.",
    "Oversaw all laboratory operations, including budget, personnel (scientists and technicians), and pioneering safety protocols for handling radioactive materials.",
    "Championed the translation of fundamental research into practical applications, particularly in the field of cancer treatment (Curietherapy)."
]

[[experience]]
role = "Director of the Red Cross Radiology Service"
company = "French Red Cross"
location = "France"
date = "1914 - 1918"
details.academia = [
    "Conceptualized and developed mobile radiography units ('petites Curies') to diagnose injuries at the front lines.",
    "Authored training materials and personally instructed 150 women as the first military radiology technicians."
]
details.industry = [
    "Led a large-scale wartime logistics and technology deployment project, procuring equipment and vehicles.",
    "Scaled operations from a single unit to 20 mobile X-ray vehicles and 200 stationary units, enabling the treatment of over one million wounded soldiers.",
    "Managed the full lifecycle of the project from concept and fundraising to execution, training, and field operations."
]

[[experience]]
role = "Researcher \\& Scientist"
company = "School of Chemistry and Physics (ESPCI)"
location = "Paris, FR"
date = "1897 - 1906"
details.academia = [
    "Conducted foundational research on 'Becquerel rays', coining the term 'radioactivity'.",
    "Discovered and scientifically described two new elements in the periodic table: polonium (Po, 1898) and radium (Ra, 1898).",
    "Determined the atomic weight of radium, solidifying its status as a new element, and investigated its physical and chemical properties."
]
details.industry = [
    "Developed an innovative and laborious process of fractional crystallization to separate radium chloride from tons of raw pitchblende ore.",
    "Pioneered a new industry based on radium, from ore processing and refining to its use in medical and industrial applications (e.g., luminous paints).",
    "Engineered and utilized a highly sensitive piezoelectric electrometer, co-developed by Pierre and Jacques Curie, for precise measurement of faint electrical charges."
]


